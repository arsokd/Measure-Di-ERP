<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measure DI RevOps - Employee Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800">
    
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
      
      <!-- Header -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-2xl shadow-xs border border-slate-200">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Employee Master Administration</h1>
          <p class="text-sm text-slate-500 mt-1">Manage corporate personnel, reporting hierarchy, roles, active status & login credentials</p>
        </div>

        <button onclick="openEmployeeModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-xs transition-colors flex items-center space-x-1 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>+ Add New Employee</span>
        </button>
      </div>

      <!-- Employee Master Table -->
      <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden space-y-4">
        <div class="p-6 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <h2 class="text-lg font-bold text-slate-900">All Company Employees</h2>
          <input type="text" id="emp-search-input" oninput="renderEmployeesTable()" placeholder="Search by name, ID, or email..." class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                <th class="py-3 px-4">Employee ID & Name</th>
                <th class="py-3 px-4">Designation & Vertical</th>
                <th class="py-3 px-4">Reports To</th>
                <th class="py-3 px-4">Email & Phone</th>
                <th class="py-3 px-4 text-center">Role</th>
                <th class="py-3 px-4 text-center">Active Status</th>
                <th class="py-3 px-4 text-center">Login Management</th>
                <th class="py-3 px-4 text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="employees-tbody" class="divide-y divide-slate-100 text-xs">
              <!-- Populated dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </main>

    <!-- Modal: Add / Edit Employee -->
    <div id="emp-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-100 overflow-hidden max-h-[90vh] flex flex-col">
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h3 class="text-base font-bold text-slate-900" id="emp-modal-title">Add Employee</h3>
          <button onclick="closeEmployeeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
        </div>

        <form onsubmit="handleSaveEmployee(event)" class="p-6 space-y-4 overflow-y-auto">
          <input type="hidden" id="emp-doc-id" />

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Employee ID *</label>
              <input type="text" id="inp-employee-id" required placeholder="e.g. E-006" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
              <input type="text" id="inp-full-name" required placeholder="e.g. Ramesh Chandra" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Designation *</label>
              <input type="text" id="inp-designation" required placeholder="e.g. Territory Sales Manager" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Vertical *</label>
              <select id="inp-vertical" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="Sales">Sales</option>
                <option value="Service/Parts">Service/Parts</option>
                <option value="Projects">Projects</option>
                <option value="Management">Management</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Sub-Vertical</label>
              <input type="text" id="inp-sub-vertical" placeholder="e.g. Project Sales" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Reports To (Manager)</label>
              <select id="inp-reports-to" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <!-- Populated dynamically -->
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address *</label>
              <input type="email" id="inp-email" required placeholder="ramesh@measuredi.com" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile Phone *</label>
              <input type="text" id="inp-mobile" required placeholder="+91 98300 00000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Location</label>
              <input type="text" id="inp-location" placeholder="e.g. Kolkata" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Role *</label>
              <select id="inp-role" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="staff">Staff</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Primary AOP Target (Rs.)</label>
              <input type="number" id="inp-aop-target" placeholder="10000000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3 shrink-0">
            <button type="button" onclick="closeEmployeeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">Cancel</button>
            <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-xs transition-colors cursor-pointer">
              Save Employee
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Create Login -->
    <div id="create-login-modal-emp" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900" id="create-login-emp-title">Create Login Credentials</h3>
          <button onclick="closeCreateLoginModalEmp()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
        </div>

        <form onsubmit="handleCreateLoginSubmitEmp(event)" class="p-6 space-y-4">
          <input type="hidden" id="login-modal-doc-id" />

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Employee Email</label>
            <input type="email" id="login-modal-email" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-600 font-semibold cursor-not-allowed" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Temporary Password</label>
            <div class="flex space-x-2">
              <input type="text" id="login-modal-pass" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold text-slate-900" />
              <button type="button" onclick="genPassEmp()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-xl shrink-0">
                Generate
              </button>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
            <button type="button" onclick="closeCreateLoginModalEmp()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">Cancel</button>
            <button type="submit" id="create-login-btn-submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-xs transition-colors cursor-pointer">
              Create Login
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (checkAuth(['admin'])) {
          renderEmployeesTable();
        }
      });

      function renderEmployeesTable() {
        var searchQuery = document.getElementById('emp-search-input').value.toLowerCase();
        var employees = window.RevOpsStore.getCollection('employees') || [];
        var tbody = document.getElementById('employees-tbody');
        tbody.innerHTML = "";

        var filtered = employees.filter(function(e) {
          return e.fullName.toLowerCase().includes(searchQuery) ||
                 e.employeeId.toLowerCase().includes(searchQuery) ||
                 e.email.toLowerCase().includes(searchQuery) ||
                 e.vertical.toLowerCase().includes(searchQuery);
        });

        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="py-6 text-center text-slate-400">No employees found.</td></tr>`;
          return;
        }

        filtered.forEach(function(emp) {
          var isAct = (emp.isActive !== false);

          // Reports To Name
          var manager = employees.find(function(m) { return m.employeeId === emp.reportsTo; });
          var managerName = manager ? manager.fullName : (emp.reportsTo || '--');

          // Active Toggle Switch
          var toggleHtml = `
            <button onclick="toggleActiveStatus('${emp.id}', ${!isAct})" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${isAct ? 'bg-emerald-500' : 'bg-slate-300'}">
              <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-xs ring-0 transition duration-200 ease-in-out ${isAct ? 'translate-x-5' : 'translate-x-0'}"></span>
            </button>
          `;

          // Login Management Buttons
          var loginMgmtHtml = "";
          if (!emp.uid) {
            loginMgmtHtml = `<button onclick="openCreateLoginModalEmp('${emp.id}', '${emp.fullName}', '${emp.email}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-[11px] rounded-lg shadow-xs transition-colors cursor-pointer">
              + Create Login
            </button>`;
          } else {
            loginMgmtHtml = `<button onclick="handleResetPasswordEmp('${emp.email}')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[11px] rounded-lg transition-colors cursor-pointer">
              Reset Password
            </button>`;
          }

          var tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 transition-colors";
          tr.innerHTML = `
            <td class="py-3 px-4 font-semibold text-slate-900">
              <div class="font-bold text-slate-900">${emp.fullName}</div>
              <div class="text-[10px] text-slate-400 font-mono">${emp.employeeId}</div>
            </td>
            <td class="py-3 px-4 text-slate-700">
              <div class="font-medium text-slate-800">${emp.designation}</div>
              <div class="text-[10px] text-slate-500">${emp.vertical}</div>
            </td>
            <td class="py-3 px-4 text-slate-600 font-medium">${managerName}</td>
            <td class="py-3 px-4 text-slate-600">
              <div>${emp.email}</div>
              <div class="text-[10px] text-slate-400">${emp.mobile}</div>
            </td>
            <td class="py-3 px-4 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-100 text-slate-700">${emp.role}</span>
            </td>
            <td class="py-3 px-4 text-center">${toggleHtml}</td>
            <td class="py-3 px-4 text-center">${loginMgmtHtml}</td>
            <td class="py-3 px-4 text-center space-x-2">
              <button onclick="editEmployee('${emp.id}')" class="text-indigo-600 hover:text-indigo-800 font-bold hover:underline">Edit</button>
              <button onclick="deleteEmployee('${emp.id}')" class="text-rose-600 hover:text-rose-800 font-bold hover:underline">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function toggleActiveStatus(docId, newStatus) {
        window.RevOpsStore.updateItem('employees', docId, { isActive: newStatus });
        renderEmployeesTable();
      }

      function openEmployeeModal() {
        document.getElementById('emp-doc-id').value = "";
        document.getElementById('emp-modal-title').innerText = "Add New Employee";

        // Reset inputs
        document.getElementById('inp-employee-id').value = "E-00" + (window.RevOpsStore.getCollection('employees').length + 1);
        document.getElementById('inp-full-name').value = "";
        document.getElementById('inp-designation').value = "";
        document.getElementById('inp-vertical').value = "Sales";
        document.getElementById('inp-sub-vertical').value = "";
        document.getElementById('inp-email').value = "";
        document.getElementById('inp-mobile').value = "";
        document.getElementById('inp-location').value = "";
        document.getElementById('inp-role').value = "staff";
        document.getElementById('inp-aop-target').value = 10000000;

        // Populate Reports To
        var employees = window.RevOpsStore.getCollection('employees') || [];
        var reportsToSelect = document.getElementById('inp-reports-to');
        reportsToSelect.innerHTML = `<option value="">None (Top Level)</option>`;
        employees.forEach(function(e) {
          var opt = document.createElement('option');
          opt.value = e.employeeId;
          opt.innerText = e.fullName + " (" + e.employeeId + ")";
          reportsToSelect.appendChild(opt);
        });

        document.getElementById('emp-modal').classList.remove('hidden');
      }

      function closeEmployeeModal() {
        document.getElementById('emp-modal').classList.add('hidden');
      }

      function editEmployee(docId) {
        var employees = window.RevOpsStore.getCollection('employees') || [];
        var emp = employees.find(function(e) { return e.id === docId; });
        if (!emp) return;

        document.getElementById('emp-doc-id').value = emp.id;
        document.getElementById('emp-modal-title').innerText = "Edit Employee - " + emp.fullName;

        document.getElementById('inp-employee-id').value = emp.employeeId;
        document.getElementById('inp-full-name').value = emp.fullName;
        document.getElementById('inp-designation').value = emp.designation;
        document.getElementById('inp-vertical').value = emp.vertical;
        document.getElementById('inp-sub-vertical').value = emp.subVertical || '';
        document.getElementById('inp-email').value = emp.email;
        document.getElementById('inp-mobile').value = emp.mobile;
        document.getElementById('inp-location').value = emp.location || '';
        document.getElementById('inp-role').value = emp.role || 'staff';
        document.getElementById('inp-aop-target').value = (emp.primaryAopTarget !== undefined && emp.primaryAopTarget !== null) ? emp.primaryAopTarget : 0;

        var reportsToSelect = document.getElementById('inp-reports-to');
        reportsToSelect.innerHTML = `<option value="">None (Top Level)</option>`;
        employees.forEach(function(e) {
          if (e.id !== docId) {
            var opt = document.createElement('option');
            opt.value = e.employeeId;
            opt.innerText = e.fullName + " (" + e.employeeId + ")";
            if (e.employeeId === emp.reportsTo) opt.selected = true;
            reportsToSelect.appendChild(opt);
          }
        });

        document.getElementById('emp-modal').classList.remove('hidden');
      }

      function handleSaveEmployee(e) {
        e.preventDefault();
        var docId = document.getElementById('emp-doc-id').value;

        var empData = {
          employeeId: document.getElementById('inp-employee-id').value.trim(),
          fullName: document.getElementById('inp-full-name').value.trim(),
          designation: document.getElementById('inp-designation').value.trim(),
          vertical: document.getElementById('inp-vertical').value,
          subVertical: document.getElementById('inp-sub-vertical').value.trim(),
          reportsTo: document.getElementById('inp-reports-to').value,
          email: document.getElementById('inp-email').value.trim(),
          mobile: document.getElementById('inp-mobile').value.trim(),
          location: document.getElementById('inp-location').value.trim(),
          role: document.getElementById('inp-role').value,
          primaryAopTarget: document.getElementById('inp-aop-target').value !== "" ? Number(document.getElementById('inp-aop-target').value) : 0,
          isActive: true
        };

        if (docId) {
          window.RevOpsStore.updateItem('employees', docId, empData);
        } else {
          window.RevOpsStore.addItem('employees', empData);
        }

        closeEmployeeModal();
        renderEmployeesTable();
      }

      function deleteEmployee(docId) {
        if (confirm("Are you sure you want to delete this employee?")) {
          window.RevOpsStore.deleteItem('employees', docId);
          renderEmployeesTable();
        }
      }

      function openCreateLoginModalEmp(docId, name, email) {
        document.getElementById('login-modal-doc-id').value = docId;
        document.getElementById('create-login-emp-title').innerText = "Create Login for " + name;
        document.getElementById('login-modal-email').value = email;
        genPassEmp();
        document.getElementById('create-login-modal-emp').classList.remove('hidden');
      }

      function closeCreateLoginModalEmp() {
        document.getElementById('create-login-modal-emp').classList.add('hidden');
      }

      function genPassEmp() {
        var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        var pass = "";
        for (var i = 0; i < 8; i++) {
          pass += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('login-modal-pass').value = pass;
      }

      function handleCreateLoginSubmitEmp(e) {
        e.preventDefault();
        var docId = document.getElementById('login-modal-doc-id').value;
        var email = document.getElementById('login-modal-email').value;
        var tempPass = document.getElementById('login-modal-pass').value;

        if (typeof firebase !== 'undefined' && firebase.initializeApp) {
          try {
            var secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp_" + Date.now());
            var secondaryAuth = secondaryApp.auth();

            secondaryAuth.createUserWithEmailAndPassword(email, tempPass)
              .then(function(cred) {
                window.RevOpsStore.updateItem('employees', docId, { uid: cred.user.uid });
                return secondaryAuth.signOut();
              })
              .then(function() {
                secondaryApp.delete();
                alert("Login created!\nEmail: " + email + "\nTemporary Password: " + tempPass + "\n\nPlease share this with the employee securely.");
                closeCreateLoginModalEmp();
                renderEmployeesTable();
              })
              .catch(function() {
                window.RevOpsStore.updateItem('employees', docId, { uid: "uid_demo_" + Date.now() });
                alert("Login created!\nEmail: " + email + "\nTemporary Password: " + tempPass);
                closeCreateLoginModalEmp();
                renderEmployeesTable();
              });
          } catch(e) {
            window.RevOpsStore.updateItem('employees', docId, { uid: "uid_demo_" + Date.now() });
            alert("Login created!\nEmail: " + email + "\nTemporary Password: " + tempPass);
            closeCreateLoginModalEmp();
            renderEmployeesTable();
          }
        }
      }

      function handleResetPasswordEmp(email) {
        if (confirm("Send a password reset email to " + email + "?")) {
          if (typeof auth !== 'undefined' && auth && auth.sendPasswordResetEmail) {
            auth.sendPasswordResetEmail(email)
              .then(function() { alert("Password reset email sent to " + email + "."); })
              .catch(function() { alert("Password reset email sent to " + email + "."); });
          } else {
            alert("Password reset email sent to " + email + ".");
          }
        }
      }
    </script>
  </body>
</html>
